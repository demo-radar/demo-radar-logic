name: Publish tested ARM64 service image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Pull pinned base images
        run: bash scripts/pull_base_images.sh
      - name: Build ARM64 release image
        shell: bash
        run: |
          docker build --platform linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "demologic:release-$GITHUB_SHA" .
      - name: Verify the release image without provider calls
        run: python3 scripts/release_service.py verify "demologic:release-$GITHUB_SHA"
      - name: Publish the verified image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          set -eu
          umask 077
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/release_service.py publish
          cat release-evidence/release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save release identity and smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-release-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 90
