name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
      - name: Install pinned Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked --group notebooks --group service
      - name: Lint
        run: uv run --locked ruff check src scripts tests service notebooks/tools
      - name: Format
        run: uv run --locked ruff format --check src scripts tests service notebooks/tools
      - name: Check publication boundary and notebook outputs
        run: uv run --locked python scripts/check_public_repo.py
      - name: Run tests when implementation exists
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' | grep -q .; then
            uv run --locked --group notebooks --group service pytest -q
          else
            echo "No tests yet; add unit and contract tests with implementation."
          fi

  service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull pinned base images
        shell: bash
        run: |
          # Read the pins from Dockerfile so there is only one source of truth.
          images=()
          while IFS= read -r image; do
            images+=("$image")
          done < <(awk 'toupper($1) == "FROM" && $2 ~ /@sha256:/ {print $2}' Dockerfile | sort -u)
          if [[ ${#images[@]} == 0 ]]; then
            echo "::error::No pinned base images found in Dockerfile."
            exit 1
          fi
          for image in "${images[@]}"; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              else
                status=$?
              fi
              if [[ "$attempt" == 3 ]]; then
                exit "$status"
              fi
              echo "::warning::Base image pull failed; retrying in $((attempt * 10)) seconds ($attempt/3)."
              sleep $((attempt * 10))
            done
          done
      - name: Build local service image
        run: docker build -t demologic:ci .
      - name: Check synthetic API and restart
        run: python3 scripts/smoke_service.py demologic:ci
